<!DOCTYPE html>
<html>
<head>
<title>Insert Marks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Enter Student Marks</h2>

<form action="InsertData" method="post">
<table>
<tr><td>Roll No:</td>
<td><input type="text" name="rollno"/></td></tr>

<tr><td>Name:</td>
<td><input type="text" name="name"/></td></tr>

<tr><td>Section:</td>
<td>
<select name="section">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
</select>
</td></tr>

<tr><td>Sub1:</td><td><input type="text" name="sub1"/></td></tr>
<tr><td>Sub2:</td><td><input type="text" name="sub2"/></td></tr>
<tr><td>Sub3:</td><td><input type="text" name="sub3"/></td></tr>
<tr><td>Sub4:</td><td><input type="text" name="sub4"/></td></tr>
<tr><td>Sub5:</td><td><input type="text" name="sub5"/></td></tr>
<tr><td>Sub6:</td><td><input type="text" name="sub6"/></td></tr>
<tr><td>Lab1:</td><td><input type="text" name="lab1"/></td></tr>
<tr><td>Lab2:</td><td><input type="text" name="lab2"/></td></tr>
<tr><td></td>
<td><input type="submit" value="Insert"/></td></tr>
</table>
</form>

</body>
</html>
